name: Release readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: v0.5.6 readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Verify release metadata
        run: bash ./scripts/check-release-consistency.sh

      - name: Verify release readiness
        run: bash ./scripts/check-release-readiness.sh

      - name: Vet backend
        run: go vet ./...

      - name: Run race-enabled backend tests
        run: go test -race ./...

      - name: Build backend
        run: go build -trimpath ./cmd/server
