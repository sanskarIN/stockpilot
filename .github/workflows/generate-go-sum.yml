name: Generate Go Sum

on:
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - .github/workflows/generate-go-sum.yml

permissions:
  contents: read

jobs:
  generate:
    name: Generate dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Generate go.sum
        run: go mod tidy
      - name: Upload dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: stockpilot-go-sum
          path: |
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 1
