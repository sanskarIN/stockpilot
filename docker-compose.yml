services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - stockpilot_db:/var/lib/postgresql/data

  app:
    build: .
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://stockpilot:stockpilot@db:5432/stockpilot?sslmode=disable
      SESSION_SECRET: change-this-before-production-change-this
      CORS_ORIGINS: http://localhost:8080
      BACKUP_DIR: /app/backups
      AUTO_MIGRATE: "true"
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  stockpilot_db:
